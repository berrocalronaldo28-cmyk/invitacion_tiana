<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pase de Entrada - XV Tiana Ximena</title>
    <!-- Fuentes elegantes -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Librería para convertir HTML a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b1d13;
            background-image: linear-gradient(rgba(11, 29, 19, 0.85), rgba(11, 29, 19, 0.85)), url('img/fondo_itinerario.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #faf8f2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Botón de descarga */
        .contenedor-acciones {
            margin-bottom: 25px;
            text-align: center;
        }

        .btn-descargar {
            background: linear-gradient(135deg, #506138, #3b4929);
            color: #faf8f2;
            border: 1px solid #c3d6a2;
            padding: 12px 26px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-descargar:hover {
            background: linear-gradient(135deg, #627745, #455630);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(195, 214, 162, 0.3);
        }

        /* TARJETA DEL BOLETO CON LÍNEAS VERTICALES DE FONDO */
        .tarjeta-boleto {
            width: 100%;
            max-width: 420px;
            /* Fondo con patrón de líneas verticales verdes finas */
            background-color: #f7faf4;
            background-image: repeating-linear-gradient(
                90deg,
                #f7faf4,
                #f7faf4 12px,
                #ebf2e4 12px,
                #ebf2e4 14px
            );
            color: #1a2617;
            border: 2px solid #a4be7b;
            border-radius: 20px;
            padding: 35px 25px 25px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            text-align: center;
        }

        /* Marcador de borde interior sutil */
        .marco-interior {
            border: 1px solid rgba(80, 97, 56, 0.25);
            border-radius: 14px;
            padding: 20px 15px;
            background: rgba(255, 255, 255, 0.82);
        }

        /* Ornamentos superiores elegantes */
        .ornamento-cabecera {
            font-size: 12px;
            color: #506138;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }

        .encabezado-boleto {
            border-bottom: 1px solid #c3d6a2;
            padding-bottom: 18px;
            margin-bottom: 20px;
        }

        .etiqueta-admision {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #506138;
            font-weight: 700;
        }

        .titulo-evento {
            font-family: 'Great Vibes', cursive;
            font-size: 46px;
            color: #2b391a;
            margin: 2px 0;
            line-height: 1.1;
        }

        .nombre-invitado {
            font-size: 19px;
            font-weight: 700;
            color: #1a2617;
            margin-top: 8px;
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        /* DETALLES DEL PASE */
        .detalles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
            background: rgba(235, 242, 228, 0.9);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #c3d6a2;
        }

        .dato-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dato-titulo {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #506138;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .dato-valor {
            font-size: 17px;
            font-weight: 700;
            color: #2b391a;
        }

        /* SECCIÓN DE FECHA Y LUGAR CON ICONOS VECTORIALES */
        .info-evento {
            margin: 20px 0;
            font-size: 13px;
            color: #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            padding: 0 10px;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .icono-svg {
            width: 16px;
            height: 16px;
            fill: #506138;
            flex-shrink: 0;
        }

        .salon-nombre {
            font-weight: 600;
            color: #2a371c;
        }

        /* PIE Y ADVERTENCIA */
        .pie-boleto {
            border-top: 1px dashed #c3d6a2;
            padding-top: 15px;
            margin-top: 20px;
            font-size: 10.5px;
            color: #555;
            line-height: 1.4;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

    <div class="contenedor-acciones">
        <button class="btn-descargar" onclick="descargarPDF()">
            <svg class="icono-svg" style="fill:#faf8f2;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Guardar Pase en PDF
        </button>
    </div>

    <!-- TARJETA PARA IMPRIMIR / DESCARGAR CON LÍNEAS DE FONDO Y MARCO -->
    <div id="boletoImprimir" class="tarjeta-boleto">
        <div class="marco-interior">
            <div class="ornamento-cabecera">✦ ✧ ✦</div>

            <div class="encabezado-boleto">
                <span class="etiqueta-admision">Boleto de acceso</span>
                <h1 class="titulo-evento">XV Años Tiana Ximena</h1>
                <div id="lblFamilia" class="nombre-invitado">Cargando...</div>
            </div>

            <div class="detalles-grid">
                <div class="dato-box">
                    <span class="dato-titulo">Accesos</span>
                    <span id="lblBoletos" class="dato-valor">1</span>
                </div>
                <div class="dato-box">
                    <span class="dato-titulo">Mesa Asignada</span>
                    <span id="lblMesa" class="dato-valor">Mesa 1</span>
                </div>
            </div>

            <div class="info-evento">
                <div class="item-info">
                    <!-- Icono Salón / Ubicación -->
                    <svg class="icono-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span class="salon-nombre">Salón: Mirage</span>
                </div>

                <div class="item-info">
                    <!-- Icono Calendario -->
                    <svg class="icono-svg" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                    <span>Sábado, 21 de Noviembre</span>
                </div>

                <div class="item-info">
                    <!-- Icono Reloj -->
                    <svg class="icono-svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    <span>Recepción: 7:30 PM</span>
                </div>
            </div>

            <div class="pie-boleto">
                Favor de presentar este boleto antes de entrar al recinto.
            </div>
        </div>
    </div>

    <script>
        function cargarDatosBoleto() {
            const urlParams = new URLSearchParams(window.location.search);

            const familiaRaw = urlParams.get('familia') || 'Invitado Especial';
            const familia = decodeURIComponent(familiaRaw);
            
            const boletos = urlParams.get('boletos') || '1';
            const mesa = urlParams.get('mesa') || 'Por asignar';

            document.getElementById('lblFamilia').textContent = familia;
            document.getElementById('lblBoletos').textContent = boletos + (parseInt(boletos) === 1 ? ' Pase' : ' Pases');
            document.getElementById('lblMesa').textContent = mesa.toLowerCase().includes('mesa') ? mesa : 'Mesa ' + mesa;
        }

        function descargarPDF() {
            const elemento = document.getElementById('boletoImprimir');
            const nombreInvitado = document.getElementById('lblFamilia').textContent.replace(/\s+/g, '_');

            const opciones = {
                margin:       [10, 10, 10, 10],
                filename:     `Pase_XV_Tiana_${nombreInvitado}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a5', orientation: 'portrait' }
            };

            html2pdf().set(opciones).from(elemento).save();
        }

        window.addEventListener('DOMContentLoaded', cargarDatosBoleto);
    </script>
</body>
</html>
